server {
    listen 80;
    listen [::]:80;
    server_name linkedin.servloci.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linkedin.servloci.in;

    ssl_certificate     /etc/letsencrypt/live/linkedin.servloci.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkedin.servloci.in/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 40m; # base64 images in create_post

    location / {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;          # MCP streams SSE
        proxy_read_timeout 300s;
    }
}
